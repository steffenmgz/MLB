<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop – My Little Baby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAV -->
  <header class="site-header" id="site-header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">
        <span class="logo-icon">🌸</span>
        <span class="logo-text">My Little Baby</span>
      </a>
      <ul class="nav__links">
        <li><a href="index.html" class="nav__link">Start</a></li>
        <li><a href="shop.html" class="nav__link active">Shop</a></li>
        <li><a href="index.html#ueber-uns" class="nav__link">Über uns</a></li>
        <li><a href="index.html#kontakt" class="nav__link">Kontakt</a></li>
      </ul>
      <div class="nav__actions">
        <button class="btn-cart" id="cartBtn" aria-label="Warenkorb">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
        <button class="nav__toggle" id="navToggle" aria-label="Menü">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- SHOP HERO -->
  <section class="shop-hero">
    <div class="container">
      <span class="section__tag">Alle Produkte</span>
      <h1>Unser Shop</h1>
      <p>Handgefertigte Gastgeschenke für jeden besonderen Anlass</p>
    </div>
  </section>

  <!-- CATEGORY FILTER PILLS -->
  <div style="background:var(--white); border-bottom:1px solid var(--beige); position:sticky; top:72px; z-index:50;">
    <div class="container" style="padding-top:14px; padding-bottom:14px;">
      <div id="catPills" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    </div>
  </div>

  <!-- SHOP LAYOUT -->
  <div class="container">
    <div class="shop-layout">
      <!-- Sidebar -->
      <aside class="filter-sidebar">
        <h3>Filter</h3>
        <div class="filter-group">
          <h4>Kategorie</h4>
          <label class="filter-option"><input type="checkbox" value="babyparty" class="filter-cat" /> Babyparty</label>
          <label class="filter-option"><input type="checkbox" value="taufe" class="filter-cat" /> Taufe</label>
          <label class="filter-option"><input type="checkbox" value="geburtstag" class="filter-cat" /> 1. Geburtstag</label>
          <label class="filter-option"><input type="checkbox" value="sets" class="filter-cat" /> Geschenksets</label>
        </div>
        <div class="filter-group">
          <h4>Preis</h4>
          <label class="filter-option"><input type="checkbox" value="0-5" class="filter-price" /> Bis 5,00 €</label>
          <label class="filter-option"><input type="checkbox" value="5-10" class="filter-price" /> 5,00 – 10,00 €</label>
          <label class="filter-option"><input type="checkbox" value="10-100" class="filter-price" /> Über 10,00 €</label>
        </div>
        <div class="filter-group">
          <h4>Tags</h4>
          <label class="filter-option"><input type="checkbox" value="bestseller" class="filter-tag" /> Bestseller</label>
          <label class="filter-option"><input type="checkbox" value="sale" class="filter-tag" /> Sale</label>
        </div>
      </aside>

      <!-- Main -->
      <main class="shop-main">
        <div class="shop-toolbar">
          <span class="shop-count" id="shopCount"></span>
          <select class="shop-sort" id="shopSort">
            <option value="default">Sortierung: Standard</option>
            <option value="price-asc">Preis: Aufsteigend</option>
            <option value="price-desc">Preis: Absteigend</option>
            <option value="rating">Beste Bewertung</option>
          </select>
        </div>
        <div class="product-grid" id="shopGrid"></div>
      </main>
    </div>
  </div>

  <!-- CART DRAWER -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer__head">
      <h3>Dein Warenkorb</h3>
      <button class="cart-drawer__close" id="cartClose">✕</button>
    </div>
    <div class="cart-drawer__items" id="cartItems"></div>
    <div class="cart-drawer__foot">
      <div class="cart-total"><span>Gesamt</span><span id="cartTotal">0,00 €</span></div>
      <p class="cart-shipping">Versandkosten werden im Checkout berechnet</p>
      <a href="checkout.html" class="btn btn--primary btn--full" id="checkoutBtn">Zur Kasse →</a>
      <button class="btn btn--ghost btn--full" id="continueBtn" style="color:var(--text);">Weiter einkaufen</button>
    </div>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
